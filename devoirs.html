<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Devoirs du jour</title>
<style>
  :root {
    --bg: #14171c;
    --bg-soft: #1b1f26;
    --card: #21262f;
    --card-done: #191d23;
    --border: #2c323d;
    --ink: #f2f0eb;
    --ink-dim: #8b93a1;
    --accent: #ffb454;
    --ok: #6ee7a8;
    --danger: #ff6b6b;
    --radius: 18px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    overscroll-behavior-y: none;
  }

  #app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    padding: 22px 20px 14px;
    background: linear-gradient(180deg, var(--bg-soft), var(--bg));
    border-bottom: 1px solid var(--border);
  }

  .date-label {
    font-size: 13px;
    color: var(--ink-dim);
    text-transform: capitalize;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 14px;
    letter-spacing: -0.02em;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--ok));
    border-radius: 99px;
    transition: width 0.35s ease;
    width: 0%;
  }

  .progress-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-dim);
    white-space: nowrap;
    min-width: 44px;
    text-align: right;
  }

  .streak-badge {
    display: none;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 10px;
  }
  .streak-badge.visible { display: inline-flex; }

  main {
    flex: 1;
    padding: 16px 16px 100px;
    overflow-y: auto;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-dim);
  }

  .empty-state .emoji { font-size: 40px; margin-bottom: 10px; }
  .empty-state p { font-size: 15px; line-height: 1.5; margin: 0; }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 14px;
    margin-bottom: 10px;
    transition: background 0.2s ease, opacity 0.2s ease, transform 0.15s ease;
  }

  .task:active { transform: scale(0.985); }

  .task.done {
    background: var(--card-done);
    opacity: 0.55;
  }

  .task.dragging {
    opacity: 0.4;
    border-color: var(--accent);
  }

  .drag-handle {
    flex-shrink: 0;
    width: 22px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
    cursor: grab;
    touch-action: none;
    margin-top: 2px;
  }
  .drag-handle:active { cursor: grabbing; }

  .checkbox {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--ink-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
    transition: all 0.15s ease;
    cursor: pointer;
  }

  .checkbox.checked {
    background: var(--ok);
    border-color: var(--ok);
  }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .checkbox.pop { animation: pop 0.28s ease; }

  .checkbox svg { width: 15px; height: 15px; display: none; }
  .checkbox.checked svg { display: block; }

  .task-body { flex: 1; min-width: 0; }

  .task-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 99px;
    letter-spacing: 0.02em;
  }

  .task-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    word-break: break-word;
  }

  .task.done .task-title {
    text-decoration: line-through;
    color: var(--ink-dim);
  }

  .task-delete {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
    background: none;
    border: none;
    cursor: pointer;
    border-radius: 8px;
  }
  .task-delete:active { background: rgba(255,107,107,0.15); color: var(--danger); }

  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--accent);
    color: #1b1206;
    border: none;
    font-size: 30px;
    font-weight: 400;
    box-shadow: 0 8px 24px rgba(255,180,84,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
  }
  .fab:active { transform: scale(0.94); }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: flex-end;
    z-index: 30;
  }
  .sheet-backdrop.open { display: flex; }

  .sheet {
    background: var(--bg-soft);
    width: 100%;
    border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }

  .sheet h2 {
    font-size: 18px;
    margin: 0 0 16px;
  }

  .field-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
    display: block;
  }

  input[type="text"] {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 16px;
    font-family: inherit;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }

  .subject-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .subject-chip {
    padding: 8px 14px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink-dim);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .subject-chip.selected {
    color: #14171c;
  }

  .sheet-buttons { display: flex; gap: 10px; }

  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-cancel { background: var(--card); color: var(--ink-dim); }
  .btn-add { background: var(--accent); color: #1b1206; }
  .btn-add:disabled { opacity: 0.4; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="date-label" id="dateLabel"></div>
    <h1>Devoirs &amp; révisions</h1>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0/0</div>
    </div>
    <div class="streak-badge" id="streakBadge">🔥 <span id="streakCount"></span> jours d'affilée</div>
  </header>

  <main id="taskList"></main>

  <button class="fab" id="fabAdd" aria-label="Ajouter">+</button>

  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet">
      <h2>Nouvelle tâche</h2>
      <label class="field-label">Matière</label>
      <div class="subject-grid" id="subjectGrid"></div>
      <label class="field-label">Description</label>
      <input type="text" id="taskInput" placeholder="Ex: Exercices 3 et 4 page 52" autocomplete="off">
      <div class="sheet-buttons">
        <button class="btn btn-cancel" id="btnCancel">Annuler</button>
        <button class="btn btn-add" id="btnAdd" disabled>Ajouter</button>
      </div>
    </div>
  </div>
</div>

<script>
  const SUBJECTS = [
    { name: "Maths", color: "#7aa2f7" },
    { name: "Français", color: "#ff9e9e" },
    { name: "Histoire-Géo", color: "#e0af68" },
    { name: "SVT", color: "#9ece6a" },
    { name: "Physique-Chimie", color: "#bb9af7" },
    { name: "Anglais", color: "#7dcfff" },
    { name: "Autre", color: "#8b93a1" }
  ];

  const STORAGE_KEY = "devoirs_today_v1";
  const STREAK_KEY = "devoirs_streak_log_v1";
  let selectedSubject = null;

  function loadStreakLog() {
    try {
      const raw = localStorage.getItem(STREAK_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveStreakLog(log) {
    try {
      localStorage.setItem(STREAK_KEY, JSON.stringify(log));
    } catch (e) {
      console.error("Erreur de sauvegarde du streak", e);
    }
  }

  // Marque le jour actuel comme "complet" si toutes les tâches sont cochées et qu'il y en a au moins une
  function updateStreak() {
    const log = loadStreakLog();
    const total = state.tasks.length;
    const done = state.tasks.filter(t => t.done).length;
    log[todayKey()] = total > 0 && done === total;
    saveStreakLog(log);
  }

  // Compte les jours consécutifs (en remontant depuis aujourd'hui ou hier) où tout était coché
  function computeStreak() {
    const log = loadStreakLog();
    let streak = 0;
    let cursor = new Date();

    // Si aujourd'hui n'est pas encore complet, on commence à compter depuis hier
    // (pour ne pas casser la série avant la fin de la journée)
    if (!log[todayKey()]) {
      cursor.setDate(cursor.getDate() - 1);
    }

    while (true) {
      const key = cursor.toISOString().slice(0, 10);
      if (log[key]) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function renderStreak() {
    const streak = computeStreak();
    const badge = document.getElementById('streakBadge');
    const count = document.getElementById('streakCount');
    if (streak >= 2) {
      count.textContent = streak;
      badge.classList.add('visible');
    } else {
      badge.classList.remove('visible');
    }
  }

  function todayKey() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { date: todayKey(), tasks: [] };
      const data = JSON.parse(raw);
      if (data.date !== todayKey()) {
        return { date: todayKey(), tasks: [] };
      }
      return data;
    } catch (e) {
      return { date: todayKey(), tasks: [] };
    }
  }

  function saveData(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.error("Erreur de sauvegarde", e);
    }
  }

  let state = loadData();

  function renderDate() {
    const d = new Date();
    const opts = { weekday: 'long', day: 'numeric', month: 'long' };
    document.getElementById('dateLabel').textContent = d.toLocaleDateString('fr-FR', opts);
  }

  function subjectColor(name) {
    const s = SUBJECTS.find(s => s.name === name);
    return s ? s.color : "#8b93a1";
  }

  function renderTasks() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';

    if (state.tasks.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="emoji">📚</div>
          <p>Aucune tâche pour aujourd'hui.<br>Appuie sur + pour en ajouter une.</p>
        </div>`;
      updateProgress();
      return;
    }

    state.tasks.forEach(task => {
      const el = document.createElement('div');
      el.className = 'task' + (task.done ? ' done' : '');
      const color = subjectColor(task.subject);
      el.dataset.id = task.id;
      el.innerHTML = `
        <div class="drag-handle" title="Glisser pour réordonner">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="8" cy="6" r="1.6"></circle><circle cx="16" cy="6" r="1.6"></circle>
            <circle cx="8" cy="12" r="1.6"></circle><circle cx="16" cy="12" r="1.6"></circle>
            <circle cx="8" cy="18" r="1.6"></circle><circle cx="16" cy="18" r="1.6"></circle>
          </svg>
        </div>
        <div class="checkbox ${task.done ? 'checked' : ''}" data-id="${task.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="#14171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="task-body">
          <div class="task-top">
            <span class="tag" style="background:${color}22; color:${color}">${task.subject}</span>
          </div>
          <div class="task-title">${escapeHtml(task.title)}</div>
        </div>
        <button class="task-delete" data-id="${task.id}" aria-label="Supprimer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      `;
      list.appendChild(el);
    });

    list.querySelectorAll('.checkbox').forEach(cb => {
      cb.addEventListener('click', () => toggleTask(cb.dataset.id));
    });
    list.querySelectorAll('.task-delete').forEach(btn => {
      btn.addEventListener('click', () => deleteTask(btn.dataset.id));
    });

    enableDragReorder(list);
    updateProgress();
  }

  function enableDragReorder(list) {
    let draggedEl = null;
    let draggedId = null;

    list.querySelectorAll('.drag-handle').forEach(handle => {
      const taskEl = handle.closest('.task');

      handle.addEventListener('touchstart', (e) => {
        draggedEl = taskEl;
        draggedId = taskEl.dataset.id;
        taskEl.classList.add('dragging');
      }, { passive: true });

      handle.addEventListener('touchmove', (e) => {
        if (!draggedEl) return;
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const targetTask = target ? target.closest('.task') : null;
        if (targetTask && targetTask !== draggedEl && list.contains(targetTask)) {
          const rect = targetTask.getBoundingClientRect();
          const before = touch.clientY < rect.top + rect.height / 2;
          list.insertBefore(draggedEl, before ? targetTask : targetTask.nextSibling);
        }
      }, { passive: false });

      handle.addEventListener('touchend', () => {
        if (!draggedEl) return;
        draggedEl.classList.remove('dragging');
        const newOrder = Array.from(list.querySelectorAll('.task')).map(el => el.dataset.id);
        state.tasks.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
        saveData(state);
        draggedEl = null;
        draggedId = null;
      });

      // Souris (utile si testé sur ordinateur)
      handle.addEventListener('mousedown', () => {
        draggedEl = taskEl;
        taskEl.classList.add('dragging');
        const onMove = (e) => {
          const target = document.elementFromPoint(e.clientX, e.clientY);
          const targetTask = target ? target.closest('.task') : null;
          if (targetTask && targetTask !== draggedEl && list.contains(targetTask)) {
            const rect = targetTask.getBoundingClientRect();
            const before = e.clientY < rect.top + rect.height / 2;
            list.insertBefore(draggedEl, before ? targetTask : targetTask.nextSibling);
          }
        };
        const onUp = () => {
          if (draggedEl) {
            draggedEl.classList.remove('dragging');
            const newOrder = Array.from(list.querySelectorAll('.task')).map(el => el.dataset.id);
            state.tasks.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
            saveData(state);
          }
          draggedEl = null;
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateProgress() {
    const total = state.tasks.length;
    const done = state.tasks.filter(t => t.done).length;
    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `${done}/${total}`;
  }

  function toggleTask(id) {
    const task = state.tasks.find(t => t.id === id);
    if (task) {
      task.done = !task.done;
      if (task.done) {
        // Petite vibration si le téléphone le supporte (Safari iOS l'ignore silencieusement sinon)
        if (navigator.vibrate) navigator.vibrate(15);
        const cb = document.querySelector(`.checkbox[data-id="${id}"]`);
        if (cb) {
          cb.classList.add('pop');
          setTimeout(() => cb.classList.remove('pop'), 300);
        }
      }
      saveData(state);
      updateStreak();
      renderTasks();
      renderStreak();
    }
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    saveData(state);
    renderTasks();
  }

  function addTask(subject, title) {
    state.tasks.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      subject,
      title,
      done: false
    });
    saveData(state);
    renderTasks();
  }

  // Sheet (formulaire d'ajout)
  const sheetBackdrop = document.getElementById('sheetBackdrop');
  const taskInput = document.getElementById('taskInput');
  const btnAdd = document.getElementById('btnAdd');
  const subjectGrid = document.getElementById('subjectGrid');

  function renderSubjectChips() {
    subjectGrid.innerHTML = '';
    SUBJECTS.forEach(s => {
      const chip = document.createElement('div');
      chip.className = 'subject-chip';
      chip.textContent = s.name;
      chip.style.borderColor = s.color + '55';
      chip.addEventListener('click', () => {
        selectedSubject = s.name;
        document.querySelectorAll('.subject-chip').forEach(c => {
          c.classList.remove('selected');
          c.style.background = 'var(--card)';
          c.style.color = 'var(--ink-dim)';
        });
        chip.classList.add('selected');
        chip.style.background = s.color;
        chip.style.color = '#14171c';
        validateForm();
      });
      subjectGrid.appendChild(chip);
    });
  }

  function validateForm() {
    btnAdd.disabled = !(selectedSubject && taskInput.value.trim().length > 0);
  }

  function openSheet() {
    selectedSubject = null;
    taskInput.value = '';
    renderSubjectChips();
    validateForm();
    sheetBackdrop.classList.add('open');
    setTimeout(() => taskInput.focus(), 100);
  }

  function closeSheet() {
    sheetBackdrop.classList.remove('open');
  }

  document.getElementById('fabAdd').addEventListener('click', openSheet);
  document.getElementById('btnCancel').addEventListener('click', closeSheet);
  sheetBackdrop.addEventListener('click', (e) => {
    if (e.target === sheetBackdrop) closeSheet();
  });
  taskInput.addEventListener('input', validateForm);
  btnAdd.addEventListener('click', () => {
    if (selectedSubject && taskInput.value.trim()) {
      addTask(selectedSubject, taskInput.value.trim());
      closeSheet();
    }
  });

  // Support d'un raccourci iOS : devoirs.html?matiere=Maths&tache=Exercices%203
  function handleUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const matiere = params.get('matiere');
    const tache = params.get('tache');
    if (matiere && tache) {
      const validSubject = SUBJECTS.find(s => s.name.toLowerCase() === matiere.toLowerCase());
      addTask(validSubject ? validSubject.name : 'Autre', tache);
      // Nettoie l'URL pour éviter les doublons si on rafraîchit
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }

  renderDate();
  renderTasks();
  renderStreak();
  handleUrlParams();
</script>
</body>
</html>
